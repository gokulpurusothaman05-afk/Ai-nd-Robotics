<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackly - 404 Not Found</title>
  <!-- Google Fonts: Inter Tight (Exact Template Font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-404-body">

  <main class="page-404-container">
    <div class="auth-form-card text-center" style="max-width: 520px; margin: auto; padding: 48px 32px;">
      <a href="index.html" class="logo-wrapper" style="justify-content: center; margin-bottom: 28px; display: inline-flex;">
        <img src="images/logo.webp" alt="Stackly Logo" class="logo-image">
        <span>Stackly</span>
      </a>

      <div class="display-10 mid" style="font-size: clamp(64px, 12vw, 92px); line-height: 1; color: #fff; margin-bottom: 12px; letter-spacing: -0.04em;">404</div>
      <span class="badge" style="margin-bottom: 16px; display: inline-block;">Sector Unresolved</span>
      <h1 class="display-7 mid" style="margin-bottom: 12px; font-size: clamp(20px, 3.5vw, 26px);">Coordinates Not Found</h1>
      <p style="color: var(--neutral-colors--400); font-size: 15px; margin-bottom: 32px; line-height: 1.5;">
        The robotics vector or page requested is not mapped in the Stackly Swarm database. Reconnect to the primary base station.
      </p>

      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="primary-button">
          <div>Return Home</div>
          <div class="primary-button-bg"><div class="primary-button-bg-text">Return Home</div></div>
        </a>
        <a href="login.html" class="btn-secondary-outline">Portal Login</a>
      </div>

      <div style="margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--neutral-colors--600); font-size: 13px; color: var(--neutral-colors--400);">
        Stackly Autonomous Robotics Inc. &copy; 2026
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
